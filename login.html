<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 农大“喵”星人档案</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">CAU CAT-archive</a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="archive.html">猫咪档案</a>
                <a href="login.html" class="active">登录</a>
            </nav>
        </div>
    </header>

    <!-- 登录页面内容 -->
    <main>
        <section id="login-page" class="login-page">
            <h2>登录页面</h2>
            <!-- 表单提交后跳转到主页 -->
            <form action="index.html" method="get">
                <label for="username">用户名：</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required><br>
                <label for="password">密码：</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required><br>
                <button type="submit" class="btn">登录</button>
            </form>
        </section>
    </main>
</body>
</html>
